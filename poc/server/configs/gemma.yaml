# Gemma 3 1B in the Ollama container, app on the host (uv run uvicorn ...); the container
# publishes port 11434 on the host. Run: APP_CONFIG=configs/gemma.yaml
asr:
  provider: openai_compat
  params: { base_url: "http://localhost:8001/v1", model: large-v3, language: pl }
  hotwords_file: configs/domain_terms.txt
llm:
  provider: litellm
  params: { model: "ollama_chat/gemma3:1b", api_base: "http://localhost:11434", temperature: 0.3 }
rag: { enabled: false }
knowledge: { enabled: true, path: ../../knowledge }   # scenarios from knowledge/ in the prompt
prompts: { system: prompts/system_v1.md, knowledge: prompts/scenario_v1.yaml }
