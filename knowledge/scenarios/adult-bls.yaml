# Adult basic life support for a layperson (cardiac arrest: unresponsive, not breathing normally).
# Steps follow the PRR step-by-step sheet and the ERC 2025 guideline; the order is: check safety
# and response, call the emergency number, check breathing, fetch an AED, compressions (with
# rescue breaths only for trained rescuers), AED. Wording is Polish and meant to be read aloud
# (numbers in words); ids, structure and comments are English.
#
# `instructions` are given one at a time. A step without `transitions` ends the scenario.
id: adult-bls
title: Resuscytacja krążeniowo-oddechowa osoby dorosłej (RKO) z użyciem AED
trigger: >-
  Dorosły poszkodowany nie reaguje (nie odpowiada, nie rusza się) albo nie oddycha lub oddycha
  nieprawidłowo.
level: layperson
start: safety

steps:
  - id: safety
    instructions:
      - Upewnij się, że Ty, poszkodowany i świadkowie jesteście bezpieczni.
    transitions:
      - when: jest bezpiecznie
        goto: check_response
      - when: coś zagraża ratownikowi (ruch uliczny, prąd, ogień, gaz, agresywna osoba)
        goto: unsafe
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – BEZPIECZEŃSTWO"}
      - {source: erc-2025-bls, section: Safety}

  - id: unsafe
    note: >-
      The branch is not spelled out in the guidelines; it follows the project rule "rescuer
      safety first".
    instructions:
      - Nie podchodź do poszkodowanego, dopóki miejsce nie jest bezpieczne. Zadzwoń pod sto dwanaście i słuchaj poleceń dyspozytora.
    transitions: []
    sources:
      - {source: erc-2025-bls, section: Safety}

  - id: check_response
    actions: [CHECK_RESPONSE]
    instructions:
      - Delikatnie potrząśnij poszkodowanego za ramiona i głośno zapytaj, czy wszystko w porządku.
    transitions:
      - when: poszkodowany nie reaguje
        goto: call_emergency
      - when: poszkodowany reaguje (odpowiada, rusza się)
        goto: responsive
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – STAN ŚWIADOMOŚCI"}

  - id: responsive
    note: >-
      The BLS algorithm applies to people who do not respond. The advice here is the general
      rule "call even if you are not sure" from the PRR key information sheet.
    instructions:
      - Poszkodowany reaguje, więc to nie jest sytuacja do RKO. Zostań przy nim i go obserwuj. Jeśli masz jakiekolwiek wątpliwości albo jego stan się pogarsza, zadzwoń pod sto dwanaście.
    transitions: []
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – STAN ŚWIADOMOŚCI"}

  - id: call_emergency
    actions: [CALL_EMERGENCY]
    instructions:
      - Jeśli ktoś jest z Tobą, poproś, żeby zadzwonił pod sto dwanaście. Jeśli jesteś sam, zadzwoń sam.
      - Włącz w telefonie tryb głośnomówiący, żeby móc zacząć RKO w trakcie rozmowy z dyspozytorem.
      - Jeśli to możliwe, zostań z poszkodowanym.
    transitions:
      - when: wezwano pomoc (ktoś dzwoni albo rozmówca rozmawia z dyspozytorem)
        goto: check_breathing
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – WEZWIJ SŁUŻBY RATUNKOWE"}
      - {source: erc-2025-bls, section: Alerting the ambulance service}

  - id: check_breathing
    actions: [OPEN_AIRWAY, CHECK_BREATHING]
    instructions:
      - Ułóż poszkodowanego na plecach.
      - Jedną rękę połóż na jego czole, a opuszki palców drugiej pod brodą. Delikatnie odegnij głowę do tyłu i unieś brodę.
      - Przez nie dłużej niż dziesięć sekund patrz, słuchaj i staraj się wyczuć, czy poszkodowany oddycha.
    asks: Czy poszkodowany oddycha prawidłowo?
    transitions:
      - when: >-
          nie oddycha, oddycha nieprawidłowo (prawie wcale, nieregularnie, powoli, głośne
          westchnienia) albo rozmówca nie ma pewności
        goto: fetch_aed
      - when: oddycha prawidłowo
        goto: breathing_normally
    sources:
      - {source: prr-bls-algorithm-2025, section: "Algorytm podstawowych zabiegów resuscytacyjnych – Oceń oddech; Jeśli nie masz pewności, to pomoże Ci dyspozytor"}
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – ODDECH"}
      - {source: erc-2025-bls, section: Recognising cardiac arrest}

  - id: breathing_normally
    note: >-
      Care of a breathing, unresponsive person (e.g. the recovery position) is a first-aid topic
      outside this scenario; the assistant only monitors and follows the dispatcher.
    instructions:
      - Poszkodowany oddycha prawidłowo. Zostań przy nim, cały czas obserwuj jego oddech i słuchaj poleceń dyspozytora. Jeśli przestanie oddychać prawidłowo, od razu zacznij RKO.
    transitions: []
    sources:
      - {source: erc-2025-bls, section: Recognising cardiac arrest}

  - id: fetch_aed
    actions: [SEND_FOR_AED]
    instructions:
      - Wyślij kogoś, żeby znalazł i przyniósł AED, czyli automatyczny defibrylator, jeśli jest dostępny. Każdy może go użyć, nawet bez szkolenia.
      - Jeśli jesteś sam, idź po AED tylko wtedy, gdy możesz je przynieść i uruchomić w ciągu jednej minuty. W przeciwnym razie od razu zacznij RKO.
    transitions:
      - when: ktoś poszedł po AED albo rozmówca zaczyna RKO od razu
        goto: chest_compressions
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – WYŚLIJ PO AED"}

  - id: chest_compressions
    actions: [CHEST_COMPRESSIONS]
    instructions:
      - Uklęknij obok poszkodowanego.
      - Połóż nasadę jednej dłoni na środku klatki piersiowej, czyli na dolnej połowie mostka.
      - Drugą dłoń połóż na pierwszej i spleć palce.
      - Wyprostuj ramiona i ustaw je pionowo nad klatką piersiową poszkodowanego.
      - Uciskaj mostek na głębokość co najmniej pięciu, ale nie więcej niż sześciu centymetrów, w tempie od stu do stu dwudziestu uciśnięć na minutę.
      - Po każdym uciśnięciu zwolnij nacisk, nie odrywając dłoni od klatki piersiowej.
    asks: Czy umiesz wykonywać oddechy ratownicze?
    transitions:
      - when: nie jest przeszkolony albo nie potrafi wykonać oddechów ratowniczych
        goto: compressions_only
      - when: jest przeszkolony i potrafi wykonać oddechy ratownicze
        goto: compressions_30_2
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – ROZPOCZNIJ UCIŚNIĘCIA KLATKI PIERSIOWEJ"}
      - {source: erc-2025-bls, section: High-quality chest compressions}

  - id: compressions_only
    actions: [CHEST_COMPRESSIONS]
    instructions:
      - Prowadź RKO wyłącznie z uciskaniem klatki piersiowej, czyli uciskaj bez przerw, w tempie od stu do stu dwudziestu uciśnięć na minutę.
      - Kontynuuj RKO do czasu przybycia pogotowia. Rzadko samo RKO przywraca pracę serca, więc nie przerywaj, chyba że masz pewność, że krążenie powróciło.
    transitions:
      - when: AED jest już na miejscu
        goto: aed
      - when: ratownik albo lekarz każe przestać, poszkodowany w oczywisty sposób odzyskuje przytomność (porusza się, otwiera oczy, prawidłowo oddycha) albo rozmówca jest zbyt zmęczony
        goto: end_cpr
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – RKO WYŁĄCZNIE Z UCISKANIEM KLATKI PIERSIOWEJ"}
      - {source: prr-bls-algorithm-2025, section: "Algorytm podstawowych zabiegów resuscytacyjnych – Dorośli, jeśli nie jesteś przeszkolony w BLS"}

  - id: compressions_30_2
    actions: [CHEST_COMPRESSIONS]
    instructions:
      - Wykonaj trzydzieści uciśnięć klatki piersiowej, tak jak przed chwilą.
    transitions:
      - when: wykonano trzydzieści uciśnięć
        goto: rescue_breaths
      - when: AED jest już na miejscu
        goto: aed
      - when: ratownik albo lekarz każe przestać, poszkodowany w oczywisty sposób odzyskuje przytomność (porusza się, otwiera oczy, prawidłowo oddycha) albo rozmówca jest zbyt zmęczony
        goto: end_cpr
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – POŁĄCZ UCIŚNIĘCIA KLATKI PIERSIOWEJ Z ODDECHAMI RATOWNICZYMI"}
      - {source: erc-2025-bls, section: Rescue breaths}

  - id: rescue_breaths
    actions: [OPEN_AIRWAY, RESCUE_BREATHS]
    instructions:
      - Ponownie udrożnij drogi oddechowe, odginając głowę do tyłu i unosząc brodę.
      - Palcem wskazującym i kciukiem ręki, która jest na czole, zaciśnij skrzydełka nosa poszkodowanego.
      - Pozwól, żeby usta poszkodowanego się otworzyły, ale trzymaj brodę uniesioną.
      - Weź normalny wdech i szczelnie obejmij swoimi ustami usta poszkodowanego.
      - Wdmuchuj powietrze jednostajnie, przez około jedną sekundę, obserwując, czy klatka piersiowa się unosi. Wdmuchnij tylko tyle powietrza, żeby klatka zaczęła się unosić.
      - Odsuń usta i obserwuj, jak klatka piersiowa opada. Weź kolejny normalny wdech i wykonaj drugi oddech ratowniczy.
      - Nie przerywaj uciśnięć dłużej niż dziesięć sekund na dwa oddechy, nawet jeśli któryś z nich byłby nieskuteczny. Bez opóźnienia wróć dłońmi na mostek i wykonaj kolejne trzydzieści uciśnięć. Kontynuuj w stosunku trzydzieści uciśnięć do dwóch oddechów.
      - Jeśli po dwóch próbach nie udaje się wdmuchnąć powietrza, rozważ, że przyczyną jest ciało obce w drogach oddechowych, i powiedz o tym dyspozytorowi.
    transitions:
      - when: wykonano dwa oddechy ratownicze
        goto: compressions_30_2
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – POŁĄCZ UCIŚNIĘCIA KLATKI PIERSIOWEJ Z ODDECHAMI RATOWNICZYMI"}
      - {source: erc-2025-bls, section: Rescue breaths}

  - id: aed
    actions: [AED_ATTACH, AED_SHOCK]
    instructions:
      - Włącz AED i przyklej elektrody na odsłoniętą klatkę piersiową poszkodowanego, w miejscach pokazanych na elektrodach. Jeśli jest z Tobą druga osoba, niech w tym czasie kontynuuje RKO.
      - Postępuj zgodnie z poleceniami głosowymi i wizualnymi AED. Gdy AED analizuje rytm serca, nikt nie może dotykać poszkodowanego.
      - Jeśli AED zaleca defibrylację, upewnij się, że ani Ty, ani nikt inny nie dotyka poszkodowanego, i naciśnij przycisk, jeśli AED o to poprosi.
      - Zaraz potem wróć do RKO zgodnie z poleceniami AED. Jeśli defibrylacja nie jest zalecana, też natychmiast wróć do RKO.
    transitions:
      - when: wracamy do RKO, a rozmówca potrafi wykonywać oddechy ratownicze
        goto: compressions_30_2
      - when: wracamy do RKO, a rozmówca nie potrafi wykonywać oddechów ratowniczych
        goto: compressions_only
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – GDY AED ZOSTANIE DOSTARCZONE"}
      - {source: erc-2025-bls, section: Using an Automated External Defibrillator (AED)}

  - id: end_cpr
    note: >-
      Only the conditions for stopping CPR come from the guideline; the closing sentence about
      staying with the person follows the project safety rules.
    instructions:
      - Dobrze. Zostań przy poszkodowanym i słuchaj poleceń dyspozytora lub zespołu ratunkowego.
    transitions: []
    sources:
      - {source: prr-bls-algorithm-2025, section: "Podstawowe zabiegi resuscytacyjne krok po kroku – Nie przerywaj resuscytacji do czasu, gdy"}
